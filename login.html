<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Digital Archaeology</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <body>
        <div class="background-glow"></div>
        <div class="grid-overlay"></div>

        <nav class="navbar">
            <a href="index.html" class="logo" style="text-decoration: none; color: inherit;">
                <span class="icon">🏛️</span>
                <span class="text">DigiArch</span>
            </a>
        </nav>

        <main class="auth-container">
            <!-- Flip Container -->
            <div class="flip-container">
                <div class="flipper" id="auth-flipper">

                    <!-- FRONT: Login -->
                    <div class="auth-face front glass-card">
                        <div class="auth-header">
                            <h2>Welcome Back</h2>
                            <p>Access your university portal</p>
                        </div>

                        <form id="login-form" class="auth-form">
                            <div class="form-group">
                                <label for="login-email">Email Address</label>
                                <input type="email" id="login-email" placeholder="student@university.edu" required>
                            </div>
                            <div class="form-group">
                                <label for="login-password">Password</label>
                                <input type="password" id="login-password" placeholder="••••••••" required>
                            </div>
                            <div class="form-actions">
                                <a href="#" class="forgot-pass">Forgot Password?</a>
                            </div>
                            <button type="submit" class="submit-btn full-width">Sign In</button>
                        </form>

                        <div class="divider"><span>OR</span></div>

                        <button class="social-btn">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                                fill="currentColor">
                                <path
                                    d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                                    fill="#4285F4" />
                                <path
                                    d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                                    fill="#34A853" />
                                <path
                                    d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.2 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                                    fill="#FBBC05" />
                                <path
                                    d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                                    fill="#EA4335" />
                            </svg>
                            Continue with Google
                        </button>

                        <div class="switch-auth">
                            <p>New here? <button class="link-btn" id="flip-to-signup">Sign Up</button></p>
                        </div>
                    </div>

                    <!-- BACK: Sign Up -->
                    <div class="auth-face back glass-card">
                        <div class="auth-header">
                            <h2>Join DigiArch</h2>
                            <p>Never miss a campus update</p>
                        </div>

                        <form id="register-form" class="auth-form">
                            <div class="form-group">
                                <label for="reg-name">Full Name</label>
                                <input type="text" id="reg-name" placeholder="John Doe" required>
                            </div>
                            <div class="form-group">
                                <label for="reg-email">Student Email</label>
                                <input type="email" id="reg-email" placeholder="student@university.edu" required>
                            </div>
                            <div class="form-group">
                                <label for="reg-password">Password</label>
                                <input type="password" id="reg-password" placeholder="Create a password" required>
                            </div>
                            <div class="form-group">
                                <label for="reg-role">Role</label>
                                <select id="reg-role" required
                                    style="width: 100%; padding: 0.8rem; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border); border-radius: 8px; color: var(--text-main); font-size: 1rem; outline: none;">
                                    <option value="user">Student / Researcher</option>
                                    <option value="admin">Administrator / Librarian</option>
                                </select>
                            </div>
                            <button type="submit" class="submit-btn full-width">Create Account</button>
                        </form>

                        <div class="switch-auth">
                            <p>Already have an account? <button class="link-btn" id="flip-to-login">Log In</button></p>
                        </div>
                    </div>

                </div>
            </div>
        </main>

        <script>
            const flipper = document.getElementById('auth-flipper');
            const toSignup = document.getElementById('flip-to-signup');
            const toLogin = document.getElementById('flip-to-login');

            if (toSignup) {
                toSignup.addEventListener('click', () => {
                    flipper.classList.add('flip');
                });
            }

            if (toLogin) {
                toLogin.addEventListener('click', () => {
                    flipper.classList.remove('flip');
                });
            }

            // SPECIFIC FORM HANDLERS

            // 1. LOGIN HANDLER
            const loginForm = document.getElementById('login-form');
            if (loginForm) {
                loginForm.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const btn = loginForm.querySelector('button[type="submit"]');
                    const email = document.getElementById('login-email').value;
                    const password = document.getElementById('login-password').value;

                    btn.innerText = "Authenticating...";

                    try {
                        const response = await fetch('http://127.0.0.1:5000/users/token', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ email, password, name: "", course: "", year: 0, interests: "" })
                        });

                        if (!response.ok) throw new Error("Invalid credentials");

                        const data = await response.json();
                        localStorage.setItem('auth_token', data.access_token);
                        localStorage.setItem('user_email', email);
                        localStorage.setItem('user_role', data.role); // Save role for UI logic

                        btn.innerText = "Success!";
                        setTimeout(() => {
                            window.location.href = 'index.html?auth=true';
                        }, 800);

                    } catch (error) {
                        btn.innerText = "Login Failed";
                        alert(error.message);
                        setTimeout(() => btn.innerText = "Sign In", 2000);
                    }
                });
            }

            // 2. SIGNUP HANDLER
            const registerForm = document.getElementById('register-form');
            if (registerForm) {
                registerForm.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const btn = registerForm.querySelector('button[type="submit"]');
                    const name = document.getElementById('reg-name').value;
                    const email = document.getElementById('reg-email').value;
                    const password = document.getElementById('reg-password').value;
                    const role = document.getElementById('reg-role').value;

                    btn.innerText = "Creating Account...";

                    try {
                        const response = await fetch('http://127.0.0.1:5000/users/register', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ name, email, password, role, course: "TBD", year: 1, interests: "General" })
                        });

                        if (!response.ok) throw new Error("Email already registered");

                        btn.innerText = "Account Created!";
                        setTimeout(() => {
                            btn.innerText = "Create Account";
                            registerForm.reset();
                            if (flipper) flipper.classList.remove('flip');
                            alert("Account created successfully! Please log in.");
                        }, 1000);

                    } catch (error) {
                        btn.innerText = "Signup Failed";
                        alert(error.message);
                        setTimeout(() => btn.innerText = "Create Account", 2000);
                    }
                });
            }
        </script>
    </body>

</html>
